# =====================================================================
# TPSL website — nginx server block (Ubuntu 22.04/24.04, nginx + php-fpm)
# Copy to /etc/nginx/sites-available/tpsl.conf, symlink into sites-enabled,
# then:  sudo nginx -t && sudo systemctl reload nginx
# Adjust: root path, php-fpm socket, certificate paths.
# =====================================================================

# --- HTTP: redirect everything to HTTPS (keeps ACME challenge reachable) ---
server {
    listen 80;
    listen [::]:80;
    server_name tpsl.in www.tpsl.in;

    location ^~ /.well-known/acme-challenge/ { root /var/www/tpsl/public_html; }
    location / { return 301 https://www.tpsl.in$request_uri; }
}

# --- HTTPS apex -> www ---
server {
    listen 443 ssl http2;          # nginx >= 1.25.1: use 'listen 443 ssl;' + 'http2 on;'
    listen [::]:443 ssl http2;
    server_name tpsl.in;

    ssl_certificate     /etc/ssl/tpsl/fullchain.pem;   # TODO
    ssl_certificate_key /etc/ssl/tpsl/privkey.pem;     # TODO
    include /etc/nginx/snippets/tpsl-tls.conf;

    return 301 https://www.tpsl.in$request_uri;
}

# --- HTTPS main site ---
server {
    listen 443 ssl http2;          # nginx >= 1.25.1: use 'listen 443 ssl;' + 'http2 on;'
    listen [::]:443 ssl http2;
    server_name www.tpsl.in;

    root  /var/www/tpsl/public_html;
    index index.html;

    ssl_certificate     /etc/ssl/tpsl/fullchain.pem;   # TODO
    ssl_certificate_key /etc/ssl/tpsl/privkey.pem;     # TODO
    include /etc/nginx/snippets/tpsl-tls.conf;

    server_tokens off;
    client_max_body_size 64k;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ---- Only allow the methods the site needs ----
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }

    # ---- Block hidden files (except .well-known) and stray source files ----
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(bak|old|orig|swp|sql|log|ini|sh|py|md|conf)$ { deny all; }

    # ---- Static assets: long cache ----
    location ~* \.(css|js|svg|png|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ^~ /assets/docs/ {
        add_header Content-Disposition "inline" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- Form handler (the only PHP file) ----
    location = /enquiry.php {
        limit_except POST { deny all; }
        limit_req zone=tpsl_form burst=5 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;    # TODO: match installed PHP version
    }
    # Never execute any other PHP
    location ~ \.php$ { return 404; }

    # ---- Pretty URLs: /support -> support.html ----
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
}

# Put this in the http {} block (e.g. /etc/nginx/conf.d/tpsl-ratelimit.conf):
#   limit_req_zone $binary_remote_addr zone=tpsl_form:10m rate=10r/m;
